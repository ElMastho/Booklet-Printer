name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release v<__version__> with the Windows exe"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install LibreOffice (PPTX conversion tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  build-windows:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import booklet_printer; print(booklet_printer.__version__)")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ $version"; exit 1
          fi

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name BookletPrinter
          --hidden-import win32timezone
          --collect-data customtkinter
          run_app.py

      - name: Smoke test the executable
        shell: pwsh
        run: |
          python -c "import pymupdf; d=pymupdf.open(); [d.new_page() for _ in range(6)]; d.save('sample.pdf')"
          $p = Start-Process -FilePath dist\BookletPrinter.exe -ArgumentList 'sample.pdf','-o','out.pdf' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          python -c "import pymupdf; d=pymupdf.open('out.pdf'); assert len(d)==4, len(d); print('OK', len(d), 'faces')"

      - uses: actions/upload-artifact@v5
        with:
          name: BookletPrinter-windows
          path: dist/BookletPrinter.exe

  ui-screenshots:
    name: UI screenshots (Windows)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Print smoke test (Microsoft Print to PDF)
        run: python scripts/print_smoke_test.py
      - name: Take screenshots
        run: |
          python scripts/ui_screenshots.py screenshots en light
          python scripts/ui_screenshots.py screenshots fr dark
      - uses: actions/upload-artifact@v5
        with:
          name: ui-screenshots
          path: screenshots/*.png
      - name: Publish screenshots to the "screenshots" branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir publish && cp screenshots/*.png publish/
          cd publish
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "UI screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Resolve tag
        id: tag
        run: |
          version=$(python3 -c "import booklet_printer; print(booklet_printer.__version__)")
          echo "name=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: BookletPrinter-windows
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists: bump __version__."; exit 1
          fi
          gh release create "$tag" dist/BookletPrinter.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Booklet Printer $tag" \
            --generate-notes
