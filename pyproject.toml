[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booklet-printer"
dynamic = ["version"]
description = "Turn a PDF or PPTX into a saddle-stitched booklet: preview, page editor and double-sided printing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "customtkinter==5.2.2",
    "pillow>=10.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
booklet-printer = "booklet_printer.cli:main"

[tool.setuptools]
packages = ["booklet_printer", "booklet_printer.ui"]

[tool.setuptools.dynamic]
version = { attr = "booklet_printer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
